<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico?v=three-dots-2" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/three-dot-32.png?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/three-dot-apple.png" />
  <meta property="og:image" content="https://elijahbryant.pro/images/elijah-bryant-social-share.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="628" />
  <meta property="og:image:alt" content="Elijah Bryant, with the words Faith + Consistency" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://elijahbryant.pro/images/elijah-bryant-social-share.jpg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book — Elijah Bryant</title>
  <meta name="description" content="A book from Elijah Bryant's shelf. Faith, consistency, and what he's reading." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600&family=Inter:wght@400;500&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600&family=Inter:wght@400;500&display=swap" /></noscript>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { font-size:16px; scroll-behavior:smooth; }
    body {
      background: #080808;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { text-decoration:none; color:inherit; }
    ::selection { background: rgba(255,255,255,0.12); }

    /* Back nav */
    .back-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 1.5rem 2rem;
      z-index: 100;
      background: linear-gradient(to bottom, #080808 60%, transparent);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #d0d0d0;
      cursor: pointer;
      transition: color 0.2s;
    }
    .back-link:hover { color: #aaa; }
    .back-dot { font-size: 6px; color: rgba(212,201,176,0.4); }

    /* Main layout */
    .book-page {
      max-width: 720px;
      margin: 0 auto;
      padding: 6rem 2rem 4rem;
    }

    /* Hero */
    .book-hero {
      display: flex;
      gap: clamp(1.5rem, 4vw, 2.5rem);
      align-items: flex-start;
      margin-bottom: 3rem;
    }

    .book-cover-wrap {
      flex-shrink: 0;
      position: relative;
    }

    .book-cover-wrap { position: relative; width: clamp(140px, 34vw, 180px); }
    .book-cover {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid rgba(212,201,176,0.35);
      background: #151515;
      display: block;
    }

    .book-cover-fallback {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 4px;
      border: 1px solid rgba(232,224,208,0.45);
      background:
        radial-gradient(circle at 50% 18%, rgba(232,224,208,0.16), transparent 42%),
        linear-gradient(180deg, #2a2622 0%, #12110f 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 14px 18px;
      text-align: left;
      box-sizing: border-box;
    }
    .tag-list { color: #d8d0c2; }
    .fallback-genre, .fallback-author {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #e8e0d0;
    }
    .fallback-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.35rem;
      line-height: 1.05;
      color: #f7f1e6;
    }

    .book-meta {
      flex: 1;
      padding-top: 0.5rem;
    }

    .book-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      color: #e8e0d0;
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }

    .book-author {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #d5d5d5;
      margin-bottom: 1rem;
    }

    .book-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
    }

    .tag {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 2px;
    }

    .tag-genre {
      color: rgba(212,201,176,0.7);
      border: 0.5px solid rgba(212,201,176,0.2);
    }

    .tag-read {
      color: rgba(120,180,100,0.8);
      border: 0.5px solid rgba(120,180,100,0.3);
    }

    .tag-list {
      color: #e4dccb;
      border: 0.5px solid rgba(212,201,176,0.12);
    }

    .buy-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #e8e0d0;
      border: 0.5px solid rgba(212,201,176,0.3);
      padding: 8px 18px;
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      margin-top: 0.5rem;
    }
    .buy-link:hover { border-color: rgba(212,201,176,0.7); }
    .buy-arrow { font-size: 0.7rem; }

    /* Sections */
    .book-section {
      margin-bottom: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .section-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #cfcfcf;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-dot {
      font-size: 5px;
      color: rgba(212,201,176,0.35);
    }

    .section-body {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: rgba(255,255,255,0.88);
      line-height: 1.8;
    }

    .section-body.empty {
      font-style: italic;
      color: rgba(255,255,255,0.78);
    }

    /* Footer */
    .book-footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      text-align: center;
    }

    .footer-brand {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.62);
    }

    /* Mobile */
    @media (max-width: 600px) {
      .book-hero {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .book-tags { justify-content: center; }
      .book-meta { padding-top: 0; }
      .book-page { padding: 5rem 1.2rem 3rem; }
    }
  </style>
</head>
<body>

  <nav class="back-nav">
    <a class="back-link" href="/?menu=books">
      <span class="back-dot">&#9679;</span>
      <span>&larr; back to books</span>
    </a>
  </nav>

  <div class="book-page" id="book-page">
    <!-- Populated by JS -->
  </div>

  <script src="js/books-data.js?v=20261003-amazon"></script>
  <script>
  (function() {
    function esc(value) {
      return String(value || '').replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    var params = new URLSearchParams(window.location.search);
    var bookId = parseInt(params.get('id'), 10);
    var book = getBookById(bookId);
    var page = document.getElementById('book-page');

    if (!book) {
      document.title = 'Book not found — Elijah Bryant';
      page.innerHTML = '<p style="text-align:center;color:#ddd;font-size:16px;margin-top:4rem;">That book isn\'t on the shelf. <a href="/?menu=books">Back to books</a></p>';
      return;
    }

    document.title = book.title + ' — Elijah Bryant';
    var description = document.querySelector('meta[name="description"]');
    if (description) {
      description.setAttribute('content', book.title + (book.author ? ' by ' + book.author : '') + '. From Elijah Bryant\'s shelf.');
    }

    var coverUrl = getBookCover(book.isbn);
    var amazonUrl = getAmazonLink(book);
    var fallback = '<div class="book-cover-fallback" aria-hidden="true">' +
      '<span class="fallback-genre">' + esc(book.genre) + '</span>' +
      '<span class="fallback-title">' + esc(book.title) + '</span>' +
      (book.author ? '<span class="fallback-author">' + esc(book.author) + '</span>' : '') +
      '</div>';
    var coverHtml = coverUrl
      ? '<img class="book-cover" src="' + esc(coverUrl) + '" alt="" onload="if(this.naturalWidth<20)this.remove()" onerror="this.remove()" />' + fallback
      : fallback;

    var statusTag = book.read
      ? '<span class="tag tag-read">Read \u2713</span>'
      : '<span class="tag tag-list">On my list</span>';

    function noteSection(label, text) {
      if (!text) return '';
      return '<div class="book-section">' +
        '<div class="section-label"><span class="section-dot">&#9679;</span> ' + label + '</div>' +
        '<div class="section-body">' + esc(text) + '</div>' +
      '</div>';
    }

    var notes = noteSection('Why I chose this book', book.why) +
      noteSection('What it did for me', book.helped) +
      noteSection('My notes', book.notes);
    if (!notes) {
      notes = '<div class="book-section"><div class="section-body empty">' +
        (book.read
          ? 'I\'ve read this one. I\'ll put what it did for me here when the note is ready.'
          : 'This one is on my list. I\'ll share what it does for me after I sit with it.') +
        '</div></div>';
    }

    page.innerHTML = '' +
      '<div class="book-hero">' +
        '<div class="book-cover-wrap">' + coverHtml + '</div>' +
        '<div class="book-meta">' +
          '<h1 class="book-title">' + esc(book.title) + '</h1>' +
          (book.author ? '<p class="book-author">' + esc(book.author) + '</p>' : '') +
          '<div class="book-tags">' +
            '<span class="tag tag-genre">' + esc(book.genre) + '</span>' +
            statusTag +
          '</div>' +
          '<a class="buy-link" href="' + esc(amazonUrl) + '" target="_blank" rel="noopener noreferrer">' +
            'Get this book <span class="buy-arrow">&rarr;</span>' +
          '</a>' +
        '</div>' +
      '</div>' +
      notes +
      '<div class="book-footer"><p class="footer-brand">Faith + Consistency</p></div>';
  })();
  </script>
</body>
</html>
