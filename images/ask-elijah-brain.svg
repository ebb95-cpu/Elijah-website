<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 36 137 123" fill="none">
<style>
  svg > path { animation: outline-glow 4.5s ease-in-out infinite; }
  line { animation: wire-pulse 3.2s ease-in-out infinite; animation-delay: calc(1.4s + var(--i, 0) * .1s); }
  g:last-child circle { transform-box: fill-box; transform-origin: center; animation: node-pulse 2.6s ease-in-out infinite; animation-delay: calc(1.3s + var(--i, 0) * .14s); }
  g:last-child circle:nth-child(4), g:last-child circle:nth-child(8), g:last-child circle:nth-child(9), g:last-child circle:nth-child(10) { animation-name: hub-pulse; }
  line, g:last-child circle { --i: 0; }
  line:nth-child(10n + 2), g:last-child circle:nth-child(10n + 2) { --i: 1; }
  line:nth-child(10n + 3), g:last-child circle:nth-child(10n + 3) { --i: 2; }
  line:nth-child(10n + 4), g:last-child circle:nth-child(10n + 4) { --i: 3; }
  line:nth-child(10n + 5), g:last-child circle:nth-child(10n + 5) { --i: 4; }
  line:nth-child(10n + 6), g:last-child circle:nth-child(10n + 6) { --i: 5; }
  line:nth-child(10n + 7), g:last-child circle:nth-child(10n + 7) { --i: 6; }
  line:nth-child(10n + 8), g:last-child circle:nth-child(10n + 8) { --i: 7; }
  line:nth-child(10n + 9), g:last-child circle:nth-child(10n + 9) { --i: 8; }
  line:nth-child(10n), g:last-child circle:nth-child(10n) { --i: 9; }
  g:last-child circle:nth-child(11) { --i: 10; }
  g:last-child circle:nth-child(12) { --i: 11; }
  g:last-child circle:nth-child(13) { --i: 0; }
  g:last-child circle:nth-child(14) { --i: 1; }
  @keyframes outline-glow { 0%, 100% { stroke-opacity: .82; } 50% { stroke-opacity: 1; } }
  @keyframes wire-pulse { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: .75; } }
  @keyframes node-pulse { 0%, 100% { opacity: .72; transform: scale(1); } 50% { opacity: 1; transform: scale(1.22); } }
  @keyframes hub-pulse { 0%, 100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.32); } }
  @media (prefers-reduced-motion: reduce) {
    svg > path, line, g:last-child circle { animation: none; }
    .packets { display: none; }
  }
</style>
